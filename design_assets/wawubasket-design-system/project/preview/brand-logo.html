<!doctype html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="_card.css">
<style>
  .card { padding: 24px 24px 32px; gap: 16px; }

  .row { display: flex; gap: 16px; align-items: stretch; }

  .panel {
    flex: 1;
    border-radius: 24px;
    padding: 40px 28px;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 18px;
    min-height: 220px;
  }
  .panel.light { background: #FFFFFF; box-shadow: inset 0 0 0 1px #E4E4E4; }
  .panel.dark  { background: #111111; }

  /* Logo holder — adds breathing room on the right so the asymmetric W
     reads as visually centered. The W's decorative top-stroke has more
     mass on the LEFT, so we add padding-right to balance the optical
     center against the geometric center of the container. */
  .mark-holder {
    display: flex;
    align-items: center;
    justify-content: center;
    padding-right: 32px;   /* optical-center compensation */
    box-sizing: content-box;
  }
  .mark-holder img {
    width: 132px;
    height: auto;
    display: block;
  }
  .mark-holder img.invert { filter: invert(1) brightness(2); }

  .mode-label {
    font-size: 11px; font-weight: 500;
    letter-spacing: 0.07em; text-transform: uppercase;
  }
  .mode-label.light { color: #A0A0A0; }
  .mode-label.dark  { color: rgba(255,255,255,0.35); }

  /* Usage rules */
  .usage {
    background: #F7F7F7; border-radius: 16px;
    padding: 18px 22px; display: flex; gap: 32px; align-items: center;
  }
  .usage-item { display: flex; flex-direction: column; gap: 4px; }
  .usage-item .u-label { font-size: 11px; font-weight: 500; letter-spacing: 0.06em; text-transform: uppercase; color: #A0A0A0; }
  .usage-item .u-val   { font-size: 13px; font-weight: 500; color: #1A1A1A; }
  .divider-v { width: 1px; background: #E4E4E4; align-self: stretch; }
</style></head>
<body>
<div class="card">
  <div class="eyebrow">Logo</div>

  <div class="row">
    <!-- Light -->
    <div class="panel light">
      <div class="mark-holder">
        <img src="../assets/logo-w-mark.svg" alt="WAWUBasket">
      </div>
      <div class="mode-label light">Light mode</div>
    </div>

    <!-- Dark -->
    <div class="panel dark">
      <div class="mark-holder">
        <img src="../assets/logo-w-mark.svg" alt="WAWUBasket" class="invert">
      </div>
      <div class="mode-label dark">Dark mode</div>
    </div>
  </div>

  <!-- Usage rules -->
  <div class="usage">
    <div class="usage-item">
      <span class="u-label">Min height</span>
      <span class="u-val">24px</span>
    </div>
    <div class="divider-v"></div>
    <div class="usage-item">
      <span class="u-label">Clear space</span>
      <span class="u-val">1× cap-height on all sides</span>
    </div>
    <div class="divider-v"></div>
    <div class="usage-item">
      <span class="u-label">Never</span>
      <span class="u-val">Stretch · Rotate · Recolor</span>
    </div>
  </div>

</div>
</body></html>
