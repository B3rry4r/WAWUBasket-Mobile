<!doctype html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="_card.css">
<style>
  .grid { display: grid; grid-template-columns: repeat(8, 1fr); gap: 18px 14px; }
  .ico { display: flex; flex-direction: column; align-items: center; gap: 8px; }
  .ico svg { width: 28px; height: 28px; fill: none; stroke: #1A1A1A; stroke-width: 1.5; stroke-linecap: round; stroke-linejoin: round; }
  .ico span { font-size: 10px; color: #7A7A7A; }
</style></head>
<body>
<div class="card">
  <div class="eyebrow">Iconography — Lucide, 1.5px, monochrome</div>
  <div class="grid">
    <div class="ico"><svg viewBox="0 0 24 24"><path d="M3 10.5 12 3l9 7.5V20a1 1 0 0 1-1 1h-5v-7h-6v7H4a1 1 0 0 1-1-1z"/></svg><span>home</span></div>
    <div class="ico"><svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="m21 21-4.3-4.3"/></svg><span>search</span></div>
    <div class="ico"><svg viewBox="0 0 24 24"><path d="M3 6h18l-2 13a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2z"/><path d="M9 10V6a3 3 0 0 1 6 0v4"/></svg><span>basket</span></div>
    <div class="ico"><svg viewBox="0 0 24 24"><path d="M12 20s-7-4.5-7-10a4 4 0 0 1 7-2.6A4 4 0 0 1 19 10c0 5.5-7 10-7 10z"/></svg><span>heart</span></div>
    <div class="ico"><svg viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M4 21a8 8 0 0 1 16 0"/></svg><span>user</span></div>
    <div class="ico"><svg viewBox="0 0 24 24"><path d="M20 10c0 6-8 12-8 12s-8-6-8-12a8 8 0 0 1 16 0Z"/><circle cx="12" cy="10" r="3"/></svg><span>pin</span></div>
    <div class="ico"><svg viewBox="0 0 24 24"><path d="M6 8a6 6 0 0 1 12 0c0 7 3 7 3 9H3c0-2 3-2 3-9z"/><path d="M10 21a2 2 0 0 0 4 0"/></svg><span>bell</span></div>
    <div class="ico"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><polyline points="12 7 12 12 15 14"/></svg><span>clock</span></div>
    <div class="ico"><svg viewBox="0 0 24 24"><polygon points="12 3 14.7 9.3 21.5 9.8 16.3 14.2 18 21 12 17.3 6 21 7.7 14.2 2.5 9.8 9.3 9.3"/></svg><span>star</span></div>
    <div class="ico"><svg viewBox="0 0 24 24"><path d="M3 7l9-4 9 4-9 4z"/><path d="M3 12l9 4 9-4"/><path d="M3 17l9 4 9-4"/></svg><span>menu</span></div>
    <div class="ico"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><line x1="12" y1="8" x2="12" y2="13"/><circle cx="12" cy="16" r="0.6" fill="#1A1A1A"/></svg><span>info</span></div>
    <div class="ico"><svg viewBox="0 0 24 24"><line x1="5" y1="12" x2="19" y2="12"/><polyline points="13 6 19 12 13 18"/></svg><span>arrow</span></div>
    <div class="ico"><svg viewBox="0 0 24 24"><polyline points="5 12 10 17 19 7"/></svg><span>check</span></div>
    <div class="ico"><svg viewBox="0 0 24 24"><line x1="6" y1="6" x2="18" y2="18"/><line x1="18" y1="6" x2="6" y2="18"/></svg><span>close</span></div>
    <div class="ico"><svg viewBox="0 0 24 24"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg><span>plus</span></div>
    <div class="ico"><svg viewBox="0 0 24 24"><line x1="5" y1="12" x2="19" y2="12"/></svg><span>minus</span></div>
  </div>
</div>
</body></html>
