<!doctype html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="_card.css"></head>
<body>
<div class="card">
  <div class="eyebrow">Status — the only sanctioned accents</div>
  <div class="row">
    <div class="swatch dark" style="background:#22C55E;"><div class="name">Success</div><div class="hex">#22C55E</div></div>
    <div class="swatch dark" style="background:#EF4444;"><div class="name">Error</div><div class="hex">#EF4444</div></div>
    <div class="swatch dark" style="background:#F59E0B;"><div class="name">Warning</div><div class="hex">#F59E0B</div></div>
    <div class="swatch dark" style="background:#3B82F6;"><div class="name">Info</div><div class="hex">#3B82F6</div></div>
  </div>
</div>
</body></html>
