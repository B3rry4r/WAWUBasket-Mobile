<!doctype html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="_card.css">
<style>
  .row { display: flex; gap: 12px; flex-wrap: wrap; align-items: center; }
  button { font-family: var(--font-sans); font-size: 16px; font-weight: 500; height: 52px; padding: 0 24px; border-radius: 999px; border: none; cursor: pointer; display: inline-flex; align-items: center; gap: 8px; }
  .primary { background: #111111; color: #fff; }
  .secondary { background: #EFEFEF; color: #1A1A1A; }
  .ghost { background: transparent; color: #1A1A1A; }
  .disabled { background: #F1F1F1; color: #A0A0A0; cursor: not-allowed; }
  .small { height: 40px; padding: 0 16px; font-size: 14px; }
</style></head>
<body>
<div class="card">
  <div class="eyebrow">Buttons</div>
  <div class="row">
    <button class="primary">Confirm order</button>
    <button class="secondary">View basket</button>
    <button class="ghost">Cancel</button>
    <button class="primary disabled">Disabled</button>
  </div>
  <div class="row">
    <button class="primary small">Add</button>
    <button class="secondary small">Filter</button>
    <button class="ghost small">Edit</button>
  </div>
</div>
</body></html>
