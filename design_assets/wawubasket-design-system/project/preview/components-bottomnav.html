<!doctype html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="_card.css">
<style>
  body { background: #F7F7F7; }
  .card { background: #F7F7F7; padding-bottom: 32px; }
  .nav { margin: 0 auto; width: 380px; background: #FFFFFF; border-radius: 999px; box-shadow: 0 12px 32px rgba(0,0,0,0.08); padding: 10px 18px; display: flex; justify-content: space-between; align-items: center; }
  .item { display: flex; flex-direction: column; align-items: center; gap: 4px; padding: 6px 10px; color: #7A7A7A; }
  .item.active { color: #111111; }
  .item svg { width: 22px; height: 22px; fill: none; stroke: currentColor; stroke-width: 1.5; stroke-linecap: round; stroke-linejoin: round; }
  .lab { font-size: 10px; font-weight: 500; letter-spacing: 0.02em; }
</style></head>
<body>
<div class="card">
  <div class="eyebrow">Bottom navigation — floating, pill, soft shadow</div>
  <div class="nav">
    <div class="item active">
      <svg viewBox="0 0 24 24"><path d="M3 10.5 12 3l9 7.5V20a1 1 0 0 1-1 1h-5v-7h-6v7H4a1 1 0 0 1-1-1z"/></svg>
      <span class="lab">Home</span>
    </div>
    <div class="item">
      <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="m21 21-4.3-4.3"/></svg>
      <span class="lab">Search</span>
    </div>
    <div class="item">
      <svg viewBox="0 0 24 24"><path d="M3 6h18l-2 13a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2z"/><path d="M9 10V6a3 3 0 0 1 6 0v4"/></svg>
      <span class="lab">Orders</span>
    </div>
    <div class="item">
      <svg viewBox="0 0 24 24"><path d="M12 20s-7-4.5-7-10a4 4 0 0 1 7-2.6A4 4 0 0 1 19 10c0 5.5-7 10-7 10z"/></svg>
      <span class="lab">Favorites</span>
    </div>
    <div class="item">
      <svg viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M4 21a8 8 0 0 1 16 0"/></svg>
      <span class="lab">Profile</span>
    </div>
  </div>
</div>
</body></html>
