<!doctype html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="_card.css">
<style>
  .stack { display: flex; align-items: flex-end; gap: 14px; }
  .unit { display: flex; flex-direction: column; align-items: center; gap: 8px; }
  .bar { background: #111111; border-radius: 4px; width: 28px; }
  .lab { font-size: 11px; color: #7A7A7A; letter-spacing: 0.04em; text-transform: uppercase; text-align: center; }
  .lab b { display:block; color:#1A1A1A; font-weight:500; letter-spacing:0; text-transform:none; font-size:13px; }
</style></head>
<body>
<div class="card">
  <div class="eyebrow">Spacing — 8pt scale</div>
  <div class="stack">
    <div class="unit"><div class="bar" style="height:4px;"></div><div class="lab"><b>XS</b>4</div></div>
    <div class="unit"><div class="bar" style="height:8px;"></div><div class="lab"><b>SM</b>8</div></div>
    <div class="unit"><div class="bar" style="height:16px;"></div><div class="lab"><b>MD</b>16</div></div>
    <div class="unit"><div class="bar" style="height:24px;"></div><div class="lab"><b>LG</b>24</div></div>
    <div class="unit"><div class="bar" style="height:32px;"></div><div class="lab"><b>XL</b>32</div></div>
    <div class="unit"><div class="bar" style="height:48px;"></div><div class="lab"><b>2XL</b>48</div></div>
  </div>
</div>
</body></html>
