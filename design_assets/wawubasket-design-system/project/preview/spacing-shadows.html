<!doctype html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="_card.css">
<style>
  body { background: #F7F7F7; }
  .card { background: #F7F7F7; }
  .row { display: grid; grid-template-columns: repeat(3, 1fr); gap: 24px; padding-top: 6px; padding-bottom: 12px; }
  .item { display: flex; flex-direction: column; align-items: center; gap: 14px; }
  .surf { width: 140px; height: 90px; background: #FFFFFF; border-radius: 20px; }
  .surf.s1 { box-shadow: 0 4px 16px rgba(0,0,0,0.04); }
  .surf.s2 { box-shadow: 0 8px 24px rgba(0,0,0,0.06); }
  .surf.s3 { box-shadow: 0 12px 32px rgba(0,0,0,0.08); }
  .lab { text-align: center; }
  .lab b { display:block; font-size:13px; font-weight:500; color:#1A1A1A; }
  .lab span { font-size:11px; color:#7A7A7A; }
</style></head>
<body>
<div class="card">
  <div class="eyebrow">Shadows — soft, single-layer only</div>
  <div class="row">
    <div class="item"><div class="surf s1"></div><div class="lab"><b>Card</b><span>0 4 16 · 4%</span></div></div>
    <div class="item"><div class="surf s2"></div><div class="lab"><b>Float</b><span>0 8 24 · 6%</span></div></div>
    <div class="item"><div class="surf s3"></div><div class="lab"><b>Nav</b><span>0 12 32 · 8%</span></div></div>
  </div>
</div>
</body></html>
