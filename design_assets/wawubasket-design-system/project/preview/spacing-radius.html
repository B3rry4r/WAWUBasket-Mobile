<!doctype html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="_card.css">
<style>
  .grid { display: grid; grid-template-columns: repeat(5, 1fr); gap: 14px; }
  .item { display: flex; flex-direction: column; align-items: center; gap: 10px; }
  .shape { width: 84px; height: 84px; background: #111111; }
  .lab { text-align: center; }
  .lab b { display:block; font-size:13px; font-weight:500; color:#1A1A1A; }
  .lab span { font-size:11px; color:#7A7A7A; font-variant-numeric: tabular-nums; }
</style></head>
<body>
<div class="card">
  <div class="eyebrow">Radius</div>
  <div class="grid">
    <div class="item"><div class="shape" style="border-radius:16px;"></div><div class="lab"><b>Button</b><span>16</span></div></div>
    <div class="item"><div class="shape" style="border-radius:16px;"></div><div class="lab"><b>Input</b><span>16</span></div></div>
    <div class="item"><div class="shape" style="border-radius:24px;"></div><div class="lab"><b>Card</b><span>24</span></div></div>
    <div class="item"><div class="shape" style="border-radius:32px;"></div><div class="lab"><b>Sheet</b><span>32</span></div></div>
    <div class="item"><div class="shape" style="border-radius:999px;"></div><div class="lab"><b>Pill</b><span>999</span></div></div>
  </div>
</div>
</body></html>
