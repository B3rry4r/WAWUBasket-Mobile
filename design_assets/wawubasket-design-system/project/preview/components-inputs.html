<!doctype html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="_card.css">
<style>
  .stack { display: flex; flex-direction: column; gap: 12px; }
  .ipt { height: 52px; background: #F9F9F9; border-radius: 16px; padding: 0 18px; display: flex; align-items: center; gap: 12px; font-size: 16px; color: #7A7A7A; border: 1px solid transparent; }
  .ipt.filled {
    color: #1A1A1A; background: #FFFFFF;
    border-color: #D4D4D4;
  }
  .ipt svg { width: 20px; height: 20px; stroke: currentColor; stroke-width: 1.5; fill: none; stroke-linecap: round; stroke-linejoin: round; flex-shrink: 0; }
</style></head>
<body>
<div class="card">
  <div class="eyebrow">Inputs · 52px · 16px radius</div>
  <div class="stack">
    <div class="ipt">
      <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="m21 21-4.3-4.3"/></svg>
      <span>Search for vendors or dishes</span>
    </div>
    <div class="ipt filled">
      <svg viewBox="0 0 24 24"><path d="M20 10c0 6-8 12-8 12s-8-6-8-12a8 8 0 0 1 16 0Z"/><circle cx="12" cy="10" r="3"/></svg>
      <span>12 Adeola Odeku St, Lagos</span>
    </div>
  </div>
</div>
</body></html>
