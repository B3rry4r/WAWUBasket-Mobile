name: wawubasket
description: "WAWUBasket, a calm, minimal, premium marketplace for orders and delivery."
publish_to: 'none'
version: 1.0.2+17

environment:
  sdk: ^3.11.5

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # State management
  flutter_riverpod: ^2.5.1

  # Routing
  go_router: ^14.6.2

  # Typography (Albert Sans — design system primary)
  google_fonts: ^6.2.1

  # Value equality for state objects
  equatable: ^2.0.5
  flutter_svg: ^2.3.0

  # Persistence (role status, KYC progress, preferences)
  shared_preferences: ^2.3.2

  # API networking — HTTP client for the WAWUBasket API, plus encrypted
  # storage for the JWT access/refresh tokens.
  dio: ^5.7.0
  flutter_secure_storage: ^9.2.2

  # Maps (rider home + active delivery mini-map). Token lives in
  # lib/core/config/secrets.dart so it never lands in version control.
  mapbox_maps_flutter: ^2.24.1

  # Runtime permission prompts (location, notifications) + a one-shot
  # current-position read for the rider map.
  permission_handler: ^11.3.1
  geolocator: ^13.0.2
  # Hands navigation off to the device's maps app (rider directions to
  # the vendor pickup and the customer drop-off).
  url_launcher: ^6.3.1

  # Receives incoming deep links / app links (e.g. wawubasket://payment/success).
  # Used to return users into the app after Flutterwave hosted checkout completes.
  app_links: ^6.3.2

  # Picks images for avatar, product photos, listing images, KYC
  # documents and chat attachments; uploaded to R2 via a presigned PUT.
  image_picker: ^1.1.2

  # WhatsApp/Telegram-style media compression before upload. Images are
  # downscaled to a ~1600px longest edge at quality ~80 (JPEG) so we never
  # ship raw camera originals over the wire. See lib/core/media/.
  flutter_image_compress: ^2.3.0

  # Push notifications
  firebase_core: ^3.6.0
  firebase_messaging: ^15.1.3
  flutter_local_notifications: ^17.2.2

  # Image caching — disk-persistent cache for vendor, profile, category images.
  cached_network_image: ^3.4.1

  # Shimmer skeleton loaders for async content (categories, vendor lists).
  shimmer: ^3.0.0

  # Real-time chat — Socket.IO client for the API's /ws gateway. Carries
  # chat.message + chat.read frames; reconnects with exponential backoff.
  socket_io_client: ^2.0.3+1

  # Offline-first chat persistence. The inbox and individual conversations
  # render from this local cache instantly, then reconcile against the API
  # in the background — chats survive cold starts and offline sessions.
  sqflite: ^2.3.3+1
  path: ^1.9.0

  # PDF asset extraction + opening (onboarding gift playbook).
  path_provider: ^2.1.4
  open_filex: ^4.7.0

  # Localization — African-language support via ARB files + gen-l10n.
  flutter_localizations:
    sdk: flutter
  intl: any

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0

  # Generates platform launcher icons from a single PNG. Run:
  #   dart run flutter_launcher_icons
  flutter_launcher_icons: ^0.14.1

# Launcher-icon configuration. Foreground PNG sits on a white background;
# Android 8+ adaptive icon picks up the foreground + background colour.
flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/logos/launcher-icon.png"
  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground: "assets/logos/launcher-icon-foreground.png"
  remove_alpha_ios: true
  min_sdk_android: 21

flutter:
  uses-material-design: true
  generate: true

  assets:
    - assets/logos/
    - assets/brand_icons/
    - assets/categories/
    - assets/docs/
    - assets/empty_states/

  # Albert Sans is loaded at runtime via google_fonts.
